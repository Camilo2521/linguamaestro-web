# Render Blueprint for the LinguaMaestro backend (Express API).
# In Render: New → Blueprint → select this repository.
# Secrets are marked `sync: false`: Render asks for their values on creation;
# they are never stored in this file.
services:
  - type: web
    name: linguamaestro-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGIN
        sync: false # the Vercel frontend URL, e.g. https://linguamaestro.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
